# ============================================================
# 部署配置模板（agent.yaml 的同名模板）。复制为 config/agent.yaml 后填写；
# config/agent.yaml 不进版本库（.gitignore），部署配置与秘密都写在那里。
#
# 【优先级】同名环境变量非空值（覆盖口） > config/agent.yaml（源） > 代码缺省。
#   `node --env-file` 会把模板里的 `KEY=` 设成空串；空串不覆盖 yaml 值。
#   .env / .env.example 只保留为兼容旧部署的覆盖入口，不再是新部署的秘密源。
#
# 本模板只列最小切片消费的字段：principals / contextProfiles（root + gateway + skillRoots）
# / llm / wecom / store。旧 hub 的 channel、host、execution、sessionTtlMs 等部署面不在此列；
# 加载层仍兼容旧键（原样解析、最小切片不消费），新部署不要再写它们。
# ============================================================

# ---- 授权名单:key = <渠道>:<用户ID>；只有 enabled: true 的用户可用 ----
# UserID 来源:企微后台通讯录,或机器人收到的 from.userid(明文)。
# 读写范围不由这里裁决:最小切片只开放「执行层自述为 read 的 operation」,
# 实体授权归执行层(AGENTS.md:宿主不建实体门)。
principals:
  "wecom:<你的企微UserID>":
    enabled: true
    # 以下两键是旧字段:加载层仍接受,最小切片不读。
    # accountSetScope: all
    # capabilities: ["read"]

# ---- Worker 的受信执行层上下文(路径只能由管理员配置,模型不能传入) ----
contextProfiles:
  <profileId>:
    # 执行层工作目录(绝对路径)。最小切片必须恰好一个 profile(多 profile 拒启)。
    root: /path/to/execution-layer
    # 相对 root 的网关调用形式;宿主 spawn 用它,不硬编码全路径。
    gateway: bin/your-gateway
    # 运行态技能面:.agents/skills-serve 下的 SKILL.md(与建造面 .agents/skills 互斥)。
    skillRoots: [".agents/skills-serve"]
    # 执行层称谓(可选,≤32 字符):进 Main 角色文本的 {{executorLabel}} 占位;
    # 缺省 = 宿主中性缺省「执行层子 Agent」。
    # executorLabel: <实例称谓>

# ---- 渠道:企微智能机器人凭据(管理台:智能机器人 → 长连接 API) ----
wecom:
  botId:
  # 长连接专用 Secret
  botSecret:

# ---- LLM(OpenAI 兼容接口;真实对话必填) ----
# 秘密只写在 config/agent.yaml(本文件复制后的那份,gitignored),不要提交。
llm:
  apiBaseUrl: https://api.example.com/v1
  apiKey:
  model: your-model

# ---- 任务底账(可选):SQLite 路径;相对路径按进程 cwd 解析 ----
# 缺省 = 仓根 .runtime/state.db(任务 + 执行记录两张最小表;重启后仍在)。
# store:
#   dbPath: .runtime/state.db

# 说明:Main 的常驻角色定义在 .agents/agents/fshine-main/agent.md(启动期读取;
# 缺失/不可读 = 启动失败)。
