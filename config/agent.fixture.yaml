# ============================================================
# 仓内 dummy 面配置（`npm run ask` 缺省使用；部署配置模板见 agent.example.yaml）。
#
# 提交进仓、零密钥：本文件只服务仓内 dummy 测试平台（scripts/eval/fixtures/dummy-platform）——
# 一个不触网的本地执行层夹具。真实 SaaS / 真实平台凭据一概不在这里。
#
# 本文件 = `npm run ask` 的缺省配置（唯一仓内配置）：旧 `scripts/eval/eval.agent.yaml`
# 通用回退配置已随 M4 死代码清扫退役（decision-log §十三），加载链为
# `explicitConfigFrom(...) ?? materializeEvalConfig(agent.fixture.yaml)`（scripts/ask.ts）。
# principals 是仓内夹具虚构身份：默认只读身份 + 写链路专用身份（后者只作声明，
# 当前最小切片的开放面仍由执行层 access=read 派生，写/确认环尚未落地）；真实 SaaS /
# 真实平台凭据一概不在这里（部署模板见 agent.example.yaml）。本文件用仓内相对 root；加载前由入口脚本把
# root 物化成绝对路径副本（scripts/resolve-config-path.ts 的 materializeEvalConfig），
# 提交的文件因此不含开发者主目录，fresh clone 零配置也能加载。
#
# root 为什么是相对路径：loadConfig 强制 root 绝对（packages/core/src/config.ts:125），
# 但提交绝对路径会把开发者主目录写进仓库（提交纪律禁止）。
# 解法 = 提交相对仓根的路径，入口脚本加载前物化到 .runtime 下的副本。
# ============================================================

# ---- 授权名单：仓内夹具专用虚构 UserID ----
principals:
  # 默认身份（第一个 enabled = ask 的缺省 principal）：只读语义保持不变。
  "wecom:fixture-user":
    accountSetScope: all
    enabled: true
    # 本面只走查询（读类）；写链路要用户确认与执行层写门，不在本路径内。
    capabilities: ["read"]
  # 写链路专用身份（2026-11-17 登记）：给写确认切片一个稳定的虚构主体。
  # 注意 capabilities 是遗留数据位——最小切片的开放面由执行层自述的 access 派生
  # （scripts/ask-runtime.ts 的 defaultExecutionFace 只把 access=read 放进允许集合），
  # 本项本身不授权写入；写确认回环无宿主通路时，该身份的写请求仍被确定性拒绝（见
  # scripts/write-confirm-loop.test.ts 的缺口钉住用例）。不要把它读成“写已开放”。
  "wecom:fixture-writer":
    accountSetScope: all
    enabled: true
    capabilities: ["read", "write"]

# ---- 通用 Worker 的受信上下文（仓内 dummy 夹具） ----
contextProfiles:
  dummy:
    # 仓内相对路径：加载前由入口脚本物化成绝对路径副本（见文件头）。
    root: scripts/eval/fixtures/dummy-platform
    # 相对 root 的网关调用形式（host spawn 用它，不硬编码全路径）。
    gateway: bin/dummy
    # 运行态技能面：dummy 夹具的技能面在 .agents/skills-serve 下。
    skillRoots: [".agents/skills-serve"]

# ---- LLM（OpenAI 兼容接口） ----
# 提交的只能是接口地址与模型名；密钥留空，由 .env 的 LLM_API_KEY 提供（.env 已 gitignored）。
# 同名非空环境变量覆盖本段：本机 .env 若已配 LLM_API_BASE_URL / LLM_MODEL，以 .env 为准。
llm:
  apiBaseUrl: https://api.stepfun.com/step_plan/v1
  model: step-3.7-flash
  apiKey:
