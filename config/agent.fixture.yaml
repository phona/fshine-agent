# ============================================================
# 仓内 dummy 面配置（`npm run ask` 缺省使用；部署配置模板见 agent.example.yaml）。
#
# 提交进仓、零密钥：本文件只服务仓内 dummy 测试平台（scripts/eval/fixtures/dummy-platform）——
# 一个不触网的本地执行层夹具。真实 SaaS / 真实平台凭据一概不在这里。
#
# 与 scripts/eval/eval.agent.yaml 的分工：
#   · eval.agent.yaml 是仓内通用回退配置（入口未显式给 config 时物化使用），principals 是
#     评测虚构身份、capabilities 含写；旧 probe / acceptance / e2e / UX A/B 仪器已随旧脚手架退役；
#   · agent.fixture.yaml 服务 `npm run ask` 的仓内 dummy 面，只有只读能力。
#   两者都在仓内、都用仓内相对 root；加载前由入口脚本把 root 物化成绝对路径副本
#   （scripts/resolve-config-path.ts 的 materializeEvalConfig），提交的文件因此不含
#   开发者主目录，fresh clone 零配置也能加载。
#
# root 为什么是相对路径：loadConfig 强制 root 绝对（packages/core/src/config.ts:125），
# 但提交绝对路径会把开发者主目录写进仓库（exposure-lint / history-hygiene 守卫拦）。
# 解法 = 提交相对仓根的路径，入口脚本加载前物化到 .runtime 下的副本。
# ============================================================

# ---- 授权名单：仓内夹具专用虚构 UserID（只读） ----
principals:
  "wecom:fixture-user":
    accountSetScope: all
    enabled: true
    # 本面只走查询（读类）；写链路要用户确认与执行层写门，不在本路径内。
    capabilities: ["read"]

# ---- 通用 Worker 的受信上下文（仓内 dummy 夹具） ----
contextProfiles:
  dummy:
    # 仓内相对路径：加载前由入口脚本物化成绝对路径副本（见文件头）。
    root: scripts/eval/fixtures/dummy-platform
    # 相对 root 的网关调用形式（host spawn 用它，不硬编码全路径）。
    gateway: bin/dummy
    # 运行态技能面：dummy 夹具的技能面在 .agents/skills-serve 下。
    skillRoots: [".agents/skills-serve"]

# ---- LLM（OpenAI 兼容接口） ----
# 提交的只能是接口地址与模型名；密钥留空，由 .env 的 LLM_API_KEY 提供（.env 已 gitignored）。
# 同名非空环境变量覆盖本段：本机 .env 若已配 LLM_API_BASE_URL / LLM_MODEL，以 .env 为准。
llm:
  apiBaseUrl: https://api.stepfun.com/step_plan/v1
  model: step-3.7-flash
  apiKey:
