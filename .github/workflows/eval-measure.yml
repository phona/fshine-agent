# Eval harness 测量：稳定性（同模型 N 轮）+ 区分度（强/弱双档 judge）。
# 手动触发（workflow_dispatch）——「量尺」的按需入口，不挂每次 push。
#
# 为什么单独一个 workflow 而不并进 eval-real：eval-real 是每 push 的 1 轮信号
# （advisory），测量是 N 轮统计，要的是通过率矩阵和双档分差，不是单轮红绿；
# 跑一次几分钟到几十分钟，不该挂在每次 push 上。
#
# 测量失败率的工作流不许在自己的目标场景下中断：稳定性任一轮机械失败、强档失败
# 都不阻止后续阶段与汇总。每个阶段单独捕获退出码写入 .runtime/status-*.txt；
# 汇总步骤逐阶段报告「完成（N/M 轮）/ 失败（退出码 X）」。最后一步的退出码只
# 反映「汇总 markdown 是否产出」，不反映被测失败率——被测失败/数据不足是测量结果，
# 不是工作流错误。
#
# 输入注入面：rounds / cases / weak_model 经步骤 env 传入并在脚本入口做格式校验
# （这些 job 持 API 密钥，输入不得拼进 run 脚本体）。校验不通过 exit 2，不进 python。
#
# 边界（与 ci.sh 头部一致）：只跑通用域自包含 eval（stock 夹具 + mock 执行器），
# 不碰真实平台、不依赖兄弟仓检出与 gitignored 配置——真实执行层的基线可比性
# 测量是 Tier B 本地活，不在 CI。
name: Eval harness measurement

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: '稳定性轮数（强模型，no-judge；正整数）'
        required: true
        default: '5'
      weak_model:
        description: '区分度对照（弱）模型（模型 id 形状）'
        required: true
        default: 'step-3.5-flash'
      cases:
        description: '用例集（逗号分隔的用例 id）'
        required: false
        default: 'G-A1,G-A2,G-A3,G-A4,G-A5,G-B1,G-Y2'

permissions:
  contents: read

# 测量跑得久，别被并发取消打断；同一 ref 同时只跑一个。
concurrency:
  group: eval-measure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    name: measure
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LLM_API_BASE_URL: ${{ secrets.LLM_API_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_JUDGE_MODEL: step-5-preview
      EXECUTION_EXECUTOR: mock
      # dispatch 输入只作为环境变量进入 shell，绝不拼进 run 脚本体。
      ROUNDS: ${{ inputs.rounds }}
      CASES: ${{ inputs.cases }}
      WEAK_MODEL: ${{ inputs.weak_model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: 校验输入（格式不合法立即 exit 2，不进 python）
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 2; }
          [[ "$ROUNDS" =~ ^[1-9][0-9]*$ ]] \
            || fail "rounds 必须是正整数，实际为：$ROUNDS"
          [[ -n "$CASES" && "$CASES" =~ ^[A-Za-z0-9-]+(,[A-Za-z0-9-]+)*$ ]] \
            || fail "cases 必须是逗号分隔的用例 id（^[A-Za-z0-9,-]+$，且无空段），实际为：$CASES"
          # 声明集是集合，与探针 --only、measure-summary 的 parseCases 同一口径。
          # 重复 id 不在这里静默去重：探针每例只跑一次，汇总若按数组加权、轮数若按未去重个数做除数，会误报。
          dups="$(node --input-type=module -e '
            import { duplicateCaseIds } from "./scripts/eval/measure-summary.mjs";
            const ids = (process.env.CASES ?? "").split(",").map((s) => s.trim()).filter(Boolean);
            process.stdout.write(duplicateCaseIds(ids).join("、"));
          ')" || fail "重复用例 id 检查未能运行"
          if [[ -n "$dups" ]]; then
            fail "cases 含重复用例 id：$dups（声明集是集合，与探针 --only 一致；重复 id 会让区分度加权、阶段轮数误报）"
          fi
          [[ "$WEAK_MODEL" =~ ^[A-Za-z0-9._-]+$ ]] \
            || fail "weak_model 必须匹配模型 id 形状 ^[A-Za-z0-9._-]+$，实际为：$WEAK_MODEL"
          # 每次测量从干净产物开始，避免上一轮残留 JSON 被当成这一轮的结果。
          mkdir -p .runtime
          rm -f .runtime/measure-stability.json .runtime/measure-strong.json .runtime/measure-weak.json
          rm -f .runtime/status-*.txt .runtime/measure-*.txt .runtime/measure-summary.md

      - name: 稳定性（强模型 × N 轮，no-judge）
        env:
          LLM_MODEL: step-5-preview
        run: |
          # 被测失败是测量结果，不是工作流错误：不因非零退出中断后续阶段。
          set +e
          python3 scripts/eval/generic-model-eval.py --no-judge \
            --rounds "$ROUNDS" \
            --only "$CASES" \
            --out .runtime/measure-stability.json > .runtime/measure-stability.txt 2>&1
          echo $? > .runtime/status-stability.txt
          exit 0

      - name: 区分度（强 / 弱 各 2 轮，judge）
        run: |
          # 强档失败也不阻止弱档运行；两个退出码分别落盘。
          set +e
          LLM_MODEL=step-5-preview python3 scripts/eval/generic-model-eval.py \
            --rounds 2 --only "$CASES" \
            --out .runtime/measure-strong.json > .runtime/measure-strong.txt 2>&1
          echo $? > .runtime/status-strong.txt
          LLM_MODEL="$WEAK_MODEL" python3 scripts/eval/generic-model-eval.py \
            --rounds 2 --only "$CASES" \
            --out .runtime/measure-weak.json > .runtime/measure-weak.txt 2>&1
          echo $? > .runtime/status-weak.txt
          exit 0

      - name: 汇总（阶段状态 + 通过率矩阵 + 双档分差 + 判据结论）
        run: |
          set -euo pipefail

          # 逐阶段状态：先核验产物完整性，再分别报「测量完成」与「机械失败」——探针测完了
          # 但有机械失败时同样返回 1（codex 复审 minor），那不是阶段未完成，失败率就是测量结果。
          stage_status() {
            local name="$1" status_file="$2" json="$3" expected="$4"
            if [ ! -f "$status_file" ]; then
              echo "- ${name}: 阶段未运行（缺状态文件）"
              return
            fi
            local status
            status="$(cat "$status_file")"
            if [ ! -s "$json" ]; then
              if [ "$status" = "0" ]; then
                echo "- ${name}: 失败（退出码 0，但无结果 JSON）"
              else
                echo "- ${name}: 阶段未完成（退出码 ${status}，无结果 JSON）"
              fi
              return
            fi
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { stageProgress } from "./scripts/eval/measure-summary.mjs";
              const [file, cases, expectedRaw, name, status] = process.argv.slice(1);
              const expected = Number(expectedRaw);
              let resultsLength = 0;
              try {
                const data = JSON.parse(readFileSync(file, "utf8"));
                resultsLength = Array.isArray(data.results) ? data.results.length : 0;
              } catch (err) {
                console.log(`- ${name}: 阶段未完成（结果 JSON 无法解析：${err.message}）`);
                process.exit(0);
              }
              const progress = stageProgress(cases, resultsLength, expected);
              if (!progress.ok) {
                console.log(`- ${name}: 阶段未完成（${progress.reason}）`);
                process.exit(0);
              }
              const done = progress.done;
              if (done < expected) {
                console.log(`- ${name}: 阶段未完成（仅 ${done}/${expected} 轮${status === "0" ? "" : `，退出码 ${status}`}）`);
              } else if (status !== "0") {
                console.log(`- ${name}: 测量完成（${done}/${expected} 轮，含机械失败：退出码 ${status}——失败率即测量结果，不是阶段故障）`);
              } else {
                console.log(`- ${name}: 完成（${done}/${expected} 轮）`);
              }
            ' "$json" "$CASES" "$expected" "$name" "$status"
          }

          # 汇总脚本的退出码是测量结论（0=通过，2=判据红，3=数据不足/用法错误），不是工作流错误。
          set +e
          node scripts/eval/measure-summary.mjs \
            --expect-cases "$CASES" --expect-rounds "$ROUNDS" --expect-disc-rounds 2 \
            .runtime/measure-stability.json -- \
            .runtime/measure-strong.json .runtime/measure-weak.json \
            > .runtime/measure-summary.md 2>&1
          summary_status=$?
          echo "$summary_status" > .runtime/status-summary.txt
          set -e

          {
            echo "## Eval harness 测量（$(date -u +%Y-%m-%dT%H:%MZ)）"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- 强模型: step-5-preview · 弱模型: ${WEAK_MODEL} · judge: step-5-preview"
            echo ""
            echo "### 阶段执行状态"
            echo ""
            stage_status "稳定性" .runtime/status-stability.txt .runtime/measure-stability.json "$ROUNDS" || true
            stage_status "强档（2 轮）" .runtime/status-strong.txt .runtime/measure-strong.json 2 || true
            stage_status "弱档（2 轮）" .runtime/status-weak.txt .runtime/measure-weak.json 2 || true
            echo ""
            if [ -s .runtime/measure-summary.md ]; then
              cat .runtime/measure-summary.md
            else
              echo "> **汇总未产出**：measure-summary.mjs 没有写出 markdown。"
            fi
            if [ "$summary_status" != "0" ]; then
              echo ""
              if [ "$summary_status" = "2" ]; then
                echo "> 汇总脚本退出码 2：判据红（有实证的判据违例，如稳定性通过率低于建议线）。这是测量结论，不是工作流故障。"
              else
                echo "> 汇总脚本退出码 ${summary_status}：数据不足/用法错误，结论只能是「无法判定」。这是测量结论，不是工作流故障。"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # 最后一步的退出码只反映「汇总本身是否成功产出」。
          if [ -s .runtime/measure-summary.md ]; then
            exit 0
          fi
          echo "::error::汇总未产出 markdown，工作流失败"
          exit 1

      - name: 上传测量产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-measure-${{ github.run_id }}
          path: |
            .runtime/measure-stability.json
            .runtime/measure-stability.txt
            .runtime/measure-strong.json
            .runtime/measure-strong.txt
            .runtime/measure-weak.json
            .runtime/measure-weak.txt
            .runtime/measure-summary.md
            .runtime/status-*.txt
          retention-days: 30
