# 同一仓库 PR 的流水线审查（2026-11-21：Codex 订阅停用，改本地 OpenAI 兼容端点的 grok）。
#
# 为什么必须 self-hosted：审查模型在局域网端点（如 http://192.168.100.1:3425/v1），
# GitHub 托管 runner 访问不到。runner 装在能访问该端点的机器上（安装/卸载件见
# docs/ops/README.md §4「PR 审查流水线」）。
#
# 开关：仓库变量 PR_REVIEW_ENABLED=true 才跑（没装 runner 时保持关闭，避免 job 无限排队）。
# 依赖：secret LLM_API_KEY；vars LLM_API_BASE_URL、PR_REVIEW_MODEL（缺省 grok/grok-4.7）。
# 审查口径与输出 schema 复用 .github/prompts/pr-review.md 与 .github/codex/review-schema.json。
# 本 workflow 不改分支保护；required check 由业主配置。
name: PR review (grok)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# 同一仓库的审查串行（幂等；不取消正在跑的审查）。
concurrency:
  group: pr-review-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  pr-review:
    name: pr-review
    # 未安装 self-hosted runner / 未启用时保持关闭：既不让 check 红，也不让 job 排队。
    if: vars.PR_REVIEW_ENABLED == 'true'
    # runner 可切换：默认 self-hosted（模型在局域网端点）；若改用云端端点（如 api.x.ai + API key），
    # 把仓库变量 PR_REVIEW_RUNNER 设为 ["ubuntu-latest"] 即可，无需自托管。
    runs-on: ${{ fromJSON(vars.PR_REVIEW_RUNNER || '["self-hosted","fshine"]') }}
    timeout-minutes: 25
    steps:
      - name: Reject fork pull requests
        id: guard
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            {
              echo "### PR review 未运行"
              echo
              echo "来源仓库是 \`$HEAD_REPO\`，不是 \`$THIS_REPO\`。"
              echo "fork pull request 不读取仓库 secret。把分支推到本仓库后再跑审查。"
              echo "这个检查失败是故意的，避免 fork 绕过 required check。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "same_repo=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "same_repo=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: success() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v4
        with:
          # 审查三方点 diff 需要 base 与 head 都在本地。浅克隆拿不到 base 提交。
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch the pull request base
        if: success() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "unexpected pull request sha" >&2
            exit 1
          fi
          if [[ ! "$BASE_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "unexpected base ref" >&2
            exit 1
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA" || git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          fi
          git cat-file -e "${BASE_SHA}^{commit}" >/dev/null
          git cat-file -e "${HEAD_SHA}^{commit}" >/dev/null
          git config --unset-all "http.https://github.com/.extraheader" || true
          if git config --local --get-regexp 'extraheader' >/dev/null 2>&1; then
            echo "git extraheader is still set" >&2
            exit 1
          fi
          echo "reviewing ${BASE_SHA}...${HEAD_SHA}"

      - name: Setup Node
        if: success() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Review the pull request
        if: success() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          # 仅为拉取历史评审提供令牌（私有仓库匿名读会 401，降级分支会让历史恒空）。
          # 模型调用前 unset——审查代理本身永远拿不到 GitHub 凭证。
          GH_TOKEN: ${{ github.token }}
          THIS_REPO: ${{ github.repository }}
          LLM_API_BASE_URL: ${{ vars.LLM_API_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          PR_REVIEW_MODEL: ${{ vars.PR_REVIEW_MODEL }}
          PR_REVIEW_EFFORT: ${{ vars.PR_REVIEW_EFFORT }}
        run: |
          set -euo pipefail
          # 本 PR 历次审查 findings（打地鼠检查的历史依据）。拉取失败不阻塞审查——降级为无历史。
          if ! gh api --paginate --slurp "repos/${THIS_REPO}/pulls/${PR_NUMBER}/reviews?per_page=100" > "$RUNNER_TEMP/prior-reviews.json" 2>"$RUNNER_TEMP/prior-reviews.err"; then
            {
              echo "### 历史评审拉取失败"
              echo
              echo "审查降级为无历史（打地鼠检查失去历史依据，其余判据不受影响）。"
            } >> "$GITHUB_STEP_SUMMARY"
            printf '[]' > "$RUNNER_TEMP/prior-reviews.json"
          fi
          PRIOR_REVIEWS_FILE="$RUNNER_TEMP/prior-reviews.json" node .github/codex/build-prompt.mjs "$RUNNER_TEMP/review-prompt.md"
          unset GITHUB_TOKEN GH_TOKEN
          set +e
          node .github/codex/llm-review.mjs "$RUNNER_TEMP/review-prompt.md" "$RUNNER_TEMP/review-stdout.txt" "$RUNNER_TEMP/review-stderr.txt"
          status=$?
          set -e
          node .github/codex/render-review.mjs scrub "$status" \
            "$RUNNER_TEMP/review-stdout.txt" \
            "$RUNNER_TEMP/review-stderr.txt" \
            "$RUNNER_TEMP/review.json"

      - name: Post the pull request review
        if: success() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "unexpected pull request number" >&2
            exit 1
          fi
          if [[ ! "$THIS_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "unexpected repository" >&2
            exit 1
          fi
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "unexpected head sha" >&2
            exit 1
          fi
          node .github/codex/render-review.mjs publish \
            "$RUNNER_TEMP/review.json" \
            "$RUNNER_TEMP/review.md" \
            "$RUNNER_TEMP/review-event" \
            "$HEAD_SHA"
          event=$(tr -d '[:space:]' < "$RUNNER_TEMP/review-event")
          case "$event" in
            COMMENT|REQUEST_CHANGES) ;;
            *)
              echo "refusing review event" >&2
              exit 1
              ;;
          esac
          {
            echo "## PR review (grok, ${event})"
            echo
            cat "$RUNNER_TEMP/review.md"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -n \
            --arg commit_id "$HEAD_SHA" \
            --arg event "$event" \
            --rawfile body "$RUNNER_TEMP/review.md" \
            '{commit_id:$commit_id, event:$event, body:$body}' \
            | gh api --method POST \
                -H "Accept: application/vnd.github+json" \
                "/repos/${THIS_REPO}/pulls/${PR_NUMBER}/reviews" \
                --input - > "$RUNNER_TEMP/gh-review.json"
          echo posted > "$RUNNER_TEMP/review-posted"
          jq -r '"posted review id=\(.id) state=\(.state)"' "$RUNNER_TEMP/gh-review.json"
          if [ "$event" = "REQUEST_CHANGES" ]; then
            echo "已提交 REQUEST_CHANGES，检查失败，便于把它设为 required check。" >&2
            exit 1
          fi

      - name: Record an infrastructure failure
        if: failure() && steps.guard.outputs.same_repo == 'true'
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/review-posted" ]; then
            exit 0
          fi
          {
            echo "### PR review 失败"
            echo
            echo "审查没有发到 pull request。日志不打印密钥。"
            echo "检查 self-hosted runner 是否在线（vars.PR_REVIEW_ENABLED）、secrets.LLM_API_KEY 与 vars.LLM_API_BASE_URL。"
          } >> "$GITHUB_STEP_SUMMARY"
