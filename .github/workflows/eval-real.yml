# GitHub Actions workflow: real-model eval (generic domain, per-push).
#
# Boundary:
#   - This workflow is the per-push information surface for real-model eval.
#     It is NOT a required check yet (本轮先只呈不拦).
#   - Judge conclusions are advisory only and never blocking.
#   - The mechanical score exit code IS the job exit code (so a future
#     required-check conversion is a one-line change).
#   - 全 worker 真实 eval（probe-real-agent / acceptance / score.ts）走仓内 dummy
#     夹具（scripts/eval/eval.agent.yaml，Wave 6 域端口后不依赖外部执行层），
#     因需真实 LLM 额度仍留在 Tier B 手动运行。
#     CI 的真实模型面 = generic-model-eval.py 最小工具环 harness（不经过全 worker），
#     走仓内 stock fixture（bin/stock），零平台路径依赖——两套面各自的夹具口径以
#     scripts/eval/eval.agent.yaml 头注「域边界」段为准。
name: Eval Real (generic domain)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  eval-real:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXECUTION_EXECUTOR: mock
      LLM_API_BASE_URL: ${{ secrets.LLM_API_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_JUDGE_MODEL: ${{ secrets.LLM_JUDGE_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # default depth (1) is enough; eval does not need full history.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run generic-model eval probe (quick, no judge)
        run: |
          set -o pipefail
          mkdir -p .runtime
          python3 scripts/eval/generic-model-eval.py --no-judge --rounds 1 --only G-A1,G-A2,G-A3,G-A4,G-A5,G-B1,G-Y2 --out .runtime/probe-generic.json 2>&1 | tee .runtime/eval-probe-summary.txt

      - name: Upload eval report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generic-eval-report
          path: |
            .runtime/probe-generic.json
            .runtime/eval-probe-summary.txt
          retention-days: 14

      - name: Comment PR with eval report
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const summaryPath = '.runtime/eval-probe-summary.txt';
            const summary = fs.existsSync(summaryPath) ? fs.readFileSync(summaryPath, 'utf8') : '(no summary)';
            // Find latest probe report
            const runtimeDir = '.runtime';
            let probePath = null;
            if (fs.existsSync(runtimeDir)) {
              const files = fs.readdirSync(runtimeDir).filter(f => f.startsWith('probe-') && f.endsWith('.json'));
              if (files.length > 0) {
                files.sort();
                probePath = path.join(runtimeDir, files[files.length - 1]);
              }
            }
            let probeSection = '(no probe report)';
            if (probePath) {
              try {
                const data = JSON.parse(fs.readFileSync(probePath, 'utf8'));
                const lines = [];
                for (const result of (data.results || [])) {
                  const status = result.mechanical_pass ? 'pass' : 'fail';
                  const detail = result.mechanical_pass
                    ? `calls=${result.calls}`
                    : `calls=${result.calls} final=${(result.final_text || '').slice(0, 120).replace(/\|/g, '\\|').replace(/\n/g, ' ')}`;
                  lines.push(`| ${result.id} | ${status} | ${detail} |`);
                }
                probeSection = [
                  '### Probe results (quick)',
                  '',
                  '| Case | Status | Detail |',
                  '| --- | --- | --- |',
                  ...lines,
                ].join('\n');
              } catch (e) {
                probeSection = `_(probe report parse error: ${e.message})_`;
              }
            }
            const tail = summary.split('\n').slice(-60).join('\n') || '(empty)';
            // 版本绑定：评论必须说清结果属于哪个 head、哪次 run——否则审查者无法
            // 在多次推送间区分「最新评论」与「当前 head 的结果」，always() 步骤在
            // 取消的 run 上也可能追加评论（codex review major，PR #4）。
            const report = [
              '## Real-model eval (generic domain, mechanical gate)',
              '',
              `- Commit: \`${context.sha}\` (PR head at run time)`,
              `- Run: ${context.payload.repository.html_url}/actions/runs/${context.runId}`,
              `- Event: ${context.eventName}`,
              '',
              'Boundary: this workflow is NOT a required check yet. Judge conclusions are advisory only.',
              '',
              probeSection,
              '',
              '### Key output tail',
              '```',
              tail,
              '```',
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report,
            });
