# GitHub Actions workflow: real-model eval (per-push information surface).
#
# Boundary:
#   - This workflow is the per-push information surface for real-model eval.
#     It is NOT a required check (本轮只呈不拦)。
#   - Judge conclusions are advisory only and never blocking（本轮判据无 judge 面：
#     裁决只认执行层审计与执行事实；LLM Judge 不在入口内消费）。
#   - The mechanical exit code IS the job exit code (so a future required-check
#     conversion is a one-line change).
#   - 旧 generic-model-eval.py 工具环 harness 已随 Minimal Reset（0b97227）删除且不恢复。
#     本 workflow 跑**用户级黑盒入口** `npm run eval:user`（与 `npm run ask` 同源装配：
#     createSession + createDummyCliClient + 仓内 dummy 夹具；逐样本证据 + summary 落
#     .runtime/eval-user/），非 required check，机械退出码承载 job 状态。
name: Eval Real (user-level)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 手动触发（2026-11-09 owner 裁定）：nightly surfacing 暂不做（另挂 issue），
  # 真模型 eval 按需手动跑。per-push 那条保持只呈不拦。
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  eval-real:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLM_API_BASE_URL: ${{ secrets.LLM_API_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # default depth (1) is enough; eval does not need full history.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run user-level eval (12 cases × 1 trial, evidence kept)
        run: |
          set -o pipefail
          mkdir -p .runtime/eval-user
          npm run eval:user -- --trials 1 --out-dir .runtime/eval-user 2>&1 | tee .runtime/eval-user/summary.txt

      - name: Upload eval report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-eval-report
          path: .runtime/eval-user/
          retention-days: 14

      - name: Comment PR with eval report
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = '.runtime/eval-user/summary.txt';
            const summary = fs.existsSync(summaryPath) ? fs.readFileSync(summaryPath, 'utf8') : '(no summary)';
            const tail = summary.split('\n').slice(-60).join('\n') || '(empty)';
            // 版本绑定：评论必须说清结果属于哪个 head、哪次 run——否则审查者无法
            // 在多次推送间区分「最新评论」与「当前 head 的结果」，always() 步骤在
            // 取消的 run 上也可能追加评论（codex review major，PR #4）。
            const report = [
              '## Real-model eval (user-level, mechanical exit code)',
              '',
              `- Commit: \`${context.sha}\` (PR head at run time)`,
              `- Run: ${context.payload.repository.html_url}/actions/runs/${context.runId}`,
              `- Event: ${context.eventName}`,
              '',
              'Boundary: this workflow is NOT a required check yet. Judge conclusions are advisory only.',
              '',
              '### Key output tail',
              '```',
              tail,
              '```',
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report,
            });
