# GitHub Actions workflow: real-model eval nightly (user-level).
#
# Boundary:
#   - Nightly only (schedule), not per-push.
#   - 单一阶段：用户级全量 `npm run eval:user -- --trials 3`（12 用例 × 3 次，全样本保留）。
#     原二期双档区分度矩阵（强/弱对照 + judge）随旧 harness 退役，不再移植
#     （任何移植 = 新评测平台代码；登记见 docs/decision-log.md §十四）。
#   - 本 workflow 非 required check；job 状态由入口机械退出码承载。
#   - 财税域 eval 留在 Tier B 手动运行。
name: Eval Nightly (user-level)

on:
  schedule:
    - cron: '0 17 * * *'   # daily UTC 17:00
  workflow_dispatch:       # allow manual re-runs

permissions:
  contents: read

jobs:
  # 用户级全量：12 用例 × 3 次（全样本保留；不筛绿）。
  eval-full:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    env:
      LLM_API_BASE_URL: ${{ secrets.LLM_API_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run user-level eval (12 cases × 3 trials)
        id: eval-full
        run: |
          set -o pipefail
          mkdir -p .runtime/eval-user
          npm run eval:user -- --trials 3 --out-dir .runtime/eval-user 2>&1 | tee .runtime/eval-user/summary-full.txt

      - name: Upload full eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-eval-full
          path: .runtime/eval-user/
          retention-days: 30

      - name: Write full eval summary to step summary
        if: always()
        run: |
          {
            echo "## User-level eval (12 cases × 3 trials)"
            echo ""
            echo "\`\`\`"
            cat .runtime/eval-user/summary-full.txt 2>/dev/null || echo "(no summary)"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
