# GitHub Actions CI for fshine-agent, self-contained.
#
# This workflow runs the deterministic gates (scripts/ci.sh):
# typecheck + unit tests（含契约行为测试）。
# It deliberately does NOT run:
# - e2e (tests/e2e needs a sibling execution-layer checkout + a gitignored
#   config/agent.yaml deployment config, see tests/e2e/harness.ts);
# - real-model eval: 三个评测 workflow（eval-real / eval-nightly / eval-measure）已随
#   harness 于 M4 死代码清扫退役（decision-log §十三）；恢复须先有可运行且被测试钉住的
#   harness 与 owner 裁定，禁止再指向已删脚本。
# No secrets, no deploy, no sibling repo, no .env.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 = 全量历史。当前确定性门不依赖 git 历史（原 history-hygiene
      # 全历史扫描守卫已随 M2 波次 1 删除）；保留 depth 0 是 M4 登记的待裁定项
      # （去/留见 decision-log §十三 gaps），不为已删守卫继续声称理由。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci

  # codex 审查脚本的自测（.github/codex 下的 node:test）。单独 job、不进 unit 基线——
  # 基线只增不减纪律见 AGENTS.md；这里只保证抄过来的审查机制自身有测试钉住。
  codex-review-scripts:
    name: codex-review-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test .github/codex/*.test.mjs
