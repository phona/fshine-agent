# GitHub Actions CI for fshine-agent, self-contained.
#
# This workflow runs the deterministic gates (scripts/ci.sh):
# typecheck + unit tests + generic-mock eval.
# It deliberately does NOT run:
# - e2e (tests/e2e needs a sibling execution-layer checkout + a gitignored
#   config/agent.yaml deployment config, see tests/e2e/harness.ts);
# - real-model eval (npm run eval needs LLM_API_* secrets and has judge
#   variance; run it manually before merge, not on every push).
# No secrets, no deploy, no sibling repo, no .env.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 = 全量历史。packages/agent/history-hygiene.test.ts 的四类敏感物
      # 零命中判据要 git log --all -p 看全历史；浅克隆（默认 depth=1）下该守卫显式失败
      # （不拿「扫不到」当「干净」），波次 4 门面重写时漏改，私有仓首轮 CI 踩中后补上。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci

  # codex 审查脚本的自测（.github/codex 下的 node:test）。单独 job、不进 unit 基线——
  # 基线只增不减纪律见 AGENTS.md；这里只保证抄过来的审查机制自身有测试钉住。
  codex-review-scripts:
    name: codex-review-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test .github/codex/*.test.mjs
