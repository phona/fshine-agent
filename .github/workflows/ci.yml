# GitHub Actions CI for fshine-agent, self-contained.
#
# This workflow runs the deterministic gates (scripts/ci.sh):
# typecheck + unit tests.
# It deliberately does NOT run:
# - e2e（旧 tests/e2e 套件已随 Minimal Reset 删除；不再作确定性门）；
# - real-model eval (LLM_API_* secrets; lives in the separate eval-real.yml /
#   eval-nightly.yml workflows, outside these deterministic gates).
# No secrets, no deploy, no sibling repo, no .env.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0（全量历史）是 sensor 历史守卫（packages/agent/history-hygiene.test.ts）
      # 的遗留要求；该守卫已随 Minimal Reset 删除（0b97227），深度本身已无消费者。
      # 保留 depth 0 只是不改变既有无害行为；如后续确认无人依赖，可回默认 depth=1。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci

  # codex 审查脚本的自测（.github/codex 下的 node:test）。单独 job、不进 unit 基线——
  # 基线只增不减纪律见 AGENTS.md；这里只保证抄过来的审查机制自身有测试钉住。
  codex-review-scripts:
    name: codex-review-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test .github/codex/*.test.mjs
