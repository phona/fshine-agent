# GitHub Actions CI for fshine-agent, self-contained.
#
# This workflow runs the deterministic gates (scripts/ci.sh):
# typecheck + unit tests + generic-mock eval.
# It deliberately does NOT run:
# - e2e (tests/e2e needs a sibling execution-layer checkout + a gitignored
#   config/agent.yaml deployment config, see tests/e2e/harness.ts);
# - real-model eval (npm run eval needs LLM_API_* secrets and has judge
#   variance; run it manually before merge, not on every push).
# No secrets, no deploy, no sibling repo, no .env.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci
