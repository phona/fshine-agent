# ============================================================
# 仓内 eval 专用配置。
# 不走平台根路径/配置路径类环境变量，改用提交进仓的 eval 配置 + 脚本侧解析。
# 由脚本侧 resolve-config-path.ts 解析，全仓统一入口；显式入口是
# --config=<path> 命令行与 AGENT_CONFIG_PATH 环境变量（原有契约保留）。
#
# 为什么只放一个 profile（dummy）：
#   resolveActiveProfileId 对「0 个或多个 profile 且未显式指定」返回
#   undefined，消费方（createContextTaskRunner / resolveContextProfile）
#   会 fail-closed 抛 CONTEXT_PROFILE_MISSING。eval 脚本走默认派生路径，
#   未设显式配置时 assembly 只能从单 profile map 取到活跃项。
#   多 profile + 显式选择是生产关注点（contextProfiles 一对多），
#   由 config/agent.example.yaml 的 deploy 配置承载，不扩散到这里。
#
# root 为什么是仓内相对路径：loadConfig 强制 root 绝对
# （packages/core/src/config.ts:125），但提交绝对路径会把开发者主目录写进仓库
# （exposure-lint / history-hygiene 守卫拦）、依赖环境变量又让 CI / fresh clone
# 加载不了。解法 = 提交相对路径，加载前由 resolve-config-path.ts 的
# materializeEvalConfig 相对仓根解析成绝对路径、物化到 .runtime/eval-agent-config.yaml
# （与 tests/e2e/harness.ts:830-842 的 patchProfile 同款模式）。
#
# 域边界：dummy 是仓内通用域夹具（collection / window / record 词汇 + ballot.* 第二
# 写域），probe / acceptance 的语料已同域端口（Wave 6）——eval 自此不依赖任何外部仓。
# 本配置保证的是「fresh clone 零配置可加载 + 委派真正 spawn 到夹具 + 端到端接线跑通」。
#
# 夹具口径注记（2026-11-08 评审，与 .github/workflows/eval-real.yml 头注对齐）：仓内
# 另有一套**最小工具环**真实模型面（scripts/eval/generic-model-eval.py、second-layer.ts、
# fixtures/generic-model-baseline.json）按设计仍走 stock fixture——它不经过本配置与全
# worker。本配置的 dummy 只服务全 worker 面（probe-real-agent / acceptance / score.ts），
# 两套面的「真实模型面用哪个夹具」以此段为准。
# ============================================================

# ---- 授权名单：eval 专用虚构 UserID，不泄漏真实身份 ----
principals:
  "wecom:eval-fixture-user":
    accountSetScope: all
    enabled: true
    # 写链路所需权限：parseCapabilities 缺省 ['read']，不显式声明则提案/确认/提交
    # 用例不可达（packages/core/src/config.ts）。stock 夹具对写操作确定性拒绝
    # （dry-run 即被 fixture 挡回），授权 write 不触达任何真实执行层。
    capabilities: ["read", "validate", "write"]

# ---- 通用 Worker 的受信上下文（eval 用 dummy 夹具） ----
contextProfiles:
  dummy:
    # 仓内相对路径：加载前由 materializeEvalConfig 解析成绝对路径（见文件头）。
    root: scripts/eval/fixtures/dummy-platform
    # 相对 root 的网关调用形式（host spawn 用它，不硬编码全路径）。
    gateway: bin/dummy
    # 运行态技能面：dummy 夹具的技能面在 .agents/skills-serve 下（与 stock 夹具的
    # root 下直挂不同——fixture 各自的结构以实际目录为准）。
    skillRoots: [".agents/skills-serve"]
    # Worker 单次任务预算（可选，默认 10 分钟）。eval 探针/验收以脚本超时为准，
    # 这里留默认值即可；如需调参，在脚本侧通过 --config / AGENT_CONFIG_PATH 指向
    # 打补丁的副本（参见 tests/e2e/harness.ts 的 patchProfile 模式）。
    # workerTimeoutMs: 600000
