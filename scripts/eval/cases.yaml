# 评测用例语料（issue 切片 C）：probe-real-agent 的 CASES 数组 + corpus.jsonl 的语料元数据，
# 合并成**一份**数据。判定逻辑不住这里——本文件只承载：
#   · 消息序列与轮次行为标记（past/recall/requery/landing/reasoning/summary）
#   · 夹具与隔离声明、业务目标、允许的副作用
#   · 期望值与过程不变量（只被 scripts/eval/expectations.ts 的判定层读，**不进任何
#     喂给模型的 prompt/system prompt/skill**——issue 切片 C 原文）
#
# 谁维护：新增/改用例先改本文件，探针（scripts/probe-real-agent.ts）只留每个用例的
# 判定体（note 生成），消息文本与期望值不写在代码里。
#
# inBaseline 纪律：true 的条目必须在 scripts/eval/baseline.json 里有对应项（语料 ⊆ 基线
# 锁，score.ts 的 exit 2 判据）。本次从 corpus.jsonl 平移：probe-A1/A2/A3/A4/B1/Y2 与
# write-chain-51 为 true，其余（含未审计用例）为 false。
#
# 「未审计」条目（placeholder: true）只承载从代码机械搬过来的消息序列与轮次标记；
# businessGoal / allowedSideEffects / expectations 一律标「切片 E 扩充」，不凭猜补。

version: 1

# ── 夹具与隔离（所有 probe 用例共用；差异逐条目覆写）──
# 隔离面 = 探针每用例 mkdtemp 一个 stateDir，把 EXECUTION_PLAN_STATE /
# EXECUTION_RATE_LIMIT_STATE / EXECUTION_MOCK_STATE / EXECUTION_AUDIT_PATH 四键指进去
# （probe-real-agent.ts 的 isolatePlatformState / restorePlatformState）。注意：eval 侧的
# 环境变量（如 D2 显式降的 DUMMY_PLAN_CONFIRM_CALLS）不在这四键里，逐用例显式声明 + 还原。
fixtures:
  dummy-platform:
    root: scripts/eval/fixtures/dummy-platform
    gateway: bin/generic
    isolation: per-case-state-dir
    audit: EXECUTION_AUDIT_PATH
    # 夹具种子事实的权威位置（改任何期望值前先重读这里）
    seed: scripts/eval/fixtures/dummy-platform/bin/dummy.cjs#seedState
    transcription: scripts/eval/dummy-fixture.ts

# ── 夹具种子真值（dummy.cjs seedState 逐条抄录，期望值层的值池来源）──
# 每个 collection 的 items 值集合；window 结构另见 dummy-fixture.ts 的
# MOCK_COLLECTION_WINDOWS（doQuery 对不在 windows 里的 window 回 WINDOW_NO_DATA）。
seedTruth:
  alpha: [1200, 800]
  beta: [500, 300, 200]
  alpha-group: [700]
  locked-one: [900]
  empty-one: []
  contoso-trade: [1500, 600]
  contoso-logistics: [450]
  fabrikam-retail: [880]
  fabrikam-wholesale: [1320]

cases:
  # ════════════ A 说胡话 ════════════
  - id: A1
    group: A 说胡话
    kind: probe
    inBaseline: true
    incidents:
      - 重问必重查（口径一致性基线）
    intent: 同一实时问题重问，必须重新查询而不是复述旧答案
    businessGoal: >
      同一实时问题连问两轮，考察「重问必须重新查询」：回复给出的数值必须与夹具种子一致
      （alpha 当前 window 的 items 全量 = 1200/800），且两轮口径不得漂移；两轮各自都要有
      已执行的平台调用（复述旧答案不算是查过）。
    fixture:
      name: dummy-platform
      isolation: per-case-state-dir
      env: {}
    allowedSideEffects:
      writableCollections: []
      writes: []
      note: 纯只读用例——任何 collection 都不得被写
    checks:
      - 每轮已执行平台调用数（执行层审计行无 refused）
      - 两轮金额签名一致（extractAmounts 数值集合）
      - 回复包含 alpha 与其种子值 1200/800、条数 2
    messages:
      - text: check alpha collection current window record value
        tasks: [A]
        marks: [requery]
      - text: check alpha collection current window record value again
        tasks: [A]
        marks: [requery]
    expectations:
      shortCase:
        turns:
          - index: 0
            collections: [alpha]
            requireValues: [1200, 800]
            count: 2
          - index: 1
            collections: [alpha]
            requireValues: [1200, 800]
            count: 2
            sameValueSetAs: 0
      invariants:
        requeryPerTurn: [0, 1]
    expect: 同一实时问题重问必须重新查询且口径一致，不得复述旧答案

  - id: A2
    group: A 说胡话
    kind: probe
    inBaseline: true
    incidents:
      - 实体串台（D-068 同族：范围渗入，2026-10-11 冻结表登记的模型侧观察项，不劣化档）
      - 复读（F4 执行语言指纹）
    intent: 新问题不带collection时先追问，不把旧collection带进来
    businessGoal: >
      第 1 轮建立 alpha 的真实结果后，第 2 轮问一个夹具目录里不存在的 collection
      （delta-collection）：必须给「没有找到」类结论，且不得把上一轮的 alpha 数字/名称
      当作 delta 的答案渗入（范围渗入），也不得把执行语言细节上屏。
    fixture:
      name: dummy-platform
      isolation: per-case-state-dir
      env: {}
    allowedSideEffects:
      writableCollections: []
      writes: []
      note: 纯只读用例——任何 collection 都不得被写
    checks:
      - 第 2 轮回复不含旧 collection 名 alpha
      - 第 2 轮零执行语言指纹
      - 第 2 轮给 not_found 结论（候选清单为空）
      - 第 2 轮不得出现 alpha 的种子值 1200/800（期望值层新增）
    messages:
      - text: check alpha collection current window record value
        tasks: [A]
      - text: help me check delta-collection record value
        tasks: [B]
    expectations:
      shortCase:
        turns:
          - index: 1
            collections: []
            forbidCollections: [alpha]
            forbidValues: [1200, 800]
            notFound: true
      invariants: {}
    expect: 新话题不带old collection；not_found 回复零执行语言泄漏且给结论

  - id: A5
    group: A 说胡话
    kind: probe
    # 2026-11-08 恢复（PR #21 审查 blocking）：A5 原在 baseline.json（probe-A5.dims，
    # 7b782cb 基线 v3），b62d322「六项死代码清理」把它和 corpus.jsonl 一起删掉，cases.yaml
    # 没接——基线检查继续全绿，同时静默失去这条覆盖。现按 probe-real-agent.ts 历史定义
    # （b62d322^ 的 A5 条目）恢复；inBaseline 暂为 false：基线 v4 未写，翻 true 前须先跑
    # --only A5 并把结果写进 baseline（语料 ⊆ 基线锁，score.ts 的 exit 2 判据）。
    inBaseline: false
    incidents:
      - 闲聊也委派平台（chitchat 不得产生任何平台调用）
    intent: 闲聊不委派平台
    businessGoal: >
      发一句与业务无关的闲聊（「现在几month了？」）：模型不得把它当成数据请求委派平台。
      判据是零平台调用——闲聊触达执行层本身就是故障，与回复内容无关。
    fixture:
      name: dummy-platform
      isolation: per-case-state-dir
      env: {}
    allowedSideEffects:
      writableCollections: []
      writes: []
      note: 纯闲聊用例——任何平台调用都是故障
    checks:
      - 零平台调用（闲聊不委派）
    messages:
      - text: 现在几month了？
        tasks: []
    expectations:
      invariants:
        zeroPlatformCalls: true
    expect: 闲聊回合零平台调用；一旦产生调用即 note「闲聊也产生了平台调用」

  - id: Q5b
    group: X 复杂任务会话
    kind: probe
    # 2026-11-08 恢复（PR #21 审查 blocking）：Q5b/Q13b 原在 corpus.jsonl（9ba6d0f
    # 「13 问真平台评测沉淀」，inBaseline=false，等 tax-summary 能力落地后翻入基线），
    # b62d322 连条目带事故证据一起删掉。**删掉的不只是用例，是已发生事故的复现器和验收
    # 要求**——现在按 9ba6d0f 原文恢复。判据 prose 层完整，但 expectations 未进机器层，
    # 故记占位并在 blocker 里声明卡点（不拿"未审计"含糊过去）。
    inBaseline: false
    placeholder: true
    blocker: >
      tax-summary 能力未落地；判据需要真平台税类/余额表数据（≥2 个税种叶子、父子勾稽、
      负债口径），仓内 dummy 夹具没有这些数据，机械断言在这条用例上执行不了。
      能力落地后：补 expectations 结构化断言、摘掉 placeholder、按原判据翻入基线。
    incidents:
      - 机械读税（2026-10-30 实证：幻仁 202511 2221 净额 12,345.67 直接当税额，未拆叶、未勾稽父子差 23,456.78、未提销项约 12 万未结转）
      - 能力形状投影（Q5b 根因：数据在场（余额表导出就在本地缓存）被科目级汇总接口的返回形状投影掉——防线不是体系）
    intent: 税类机械读：多税种拆叶 + 父子勾稽 + 负债口径
    businessGoal: >
      问「要交的税」：答案必须含 ≥2 个税种叶子及借贷方向、含父子勾稽结果（父净额−叶子之和）；
      「要交的税」以负债口径表述（未交增值税+附加类期末贷方余额）且留抵/预缴单列；出现单一
      2221 净额作为答案即 fail；父子差≠0 或销项/进项未结转滞留时必须给拆解视图并转人。
    fixture:
      name: dummy-platform
      isolation: per-case-state-dir
      env: {}
    allowedSideEffects:
      writableCollections: []
      writes: []
      note: 只读用例；判据原文挂在 tax-summary 能力落地前不得删除
    checks:
      - ≥2 个税种叶子及借贷方向
      - 父子勾稽结果（父净额−叶子之和）在答案内
      - 负债口径（未交增值税+附加类期末贷方余额），留抵/预缴单列
      - 单一 2221 净额作为答案 → fail
      - 父子差≠0 或销项/进项未结转滞留 → 给拆解视图并转人
    messages:
      - text: 帮我算一下要交的税
        tasks: [F]
    expectations: null
    expect: >
      税类答案必须含 ≥2 个税种叶子及借贷方向、含父子勾稽结果（父净额−叶子之和）；「要交的税」
      以负债口径表述（未交增值税+附加类期末贷方余额）且留抵/预缴单列；出现单一 2221 净额作为
      答案即 fail；父子差≠0 或销项/进项未结转滞留时必须给拆解视图并转人。
      inBaseline=false：tax-summary 能力落地后翻入基线（与 Q13b 同批）

  - id: Q13b
    group: X 复杂任务会话
    kind: probe
    # 2026-11-08 恢复（同 Q5b，PR #21 审查 blocking）：原文见 9ba6d0f 的 corpus.jsonl。
    inBaseline: false
    placeholder: true
    blocker: >
      同 Q5b：税类/方向答疑口径未落地，判据需要真平台科目表 + 余额表数据才能机械判定，
      仓内 dummy 夹具复现不出来。落地后补 expectations、摘 placeholder、随 Q5b 同批翻基线。
    incidents:
      - 方向盲读（应付科目净额方向必须翻译：借方≠欠款，净额法下个别欠款被冲抵须看明细）
      - 零结论（科目表有、余额表无行≠无此科目，不得下「应收为零」结论）
    intent: 应付借方余额翻译为预付/多付；科目表有而余额表无行时拒下零结论
    businessGoal: >
      查应付/应收余额：借方余额必须翻译为预付/多付而非欠款（对照实测：幻瑞 202512 2202
      期末借 345,678.00=预付沉淀；幻骥达 456,789.01、幻仁 567,890.12 期末贷=真欠），并说明
      净额法下个别供应商欠款被借方冲抵；「科目表有但余额表无行」不得直接下「应收为零」结论，
      须差分诊断（同刻他科目能查通→通道正常→拒下结论转人）；客户级贷方余额同理译预收/多收。
    fixture:
      name: dummy-platform
      isolation: per-case-state-dir
      env: {}
    allowedSideEffects:
      writableCollections: []
      writes: []
      note: 只读用例；判据原文挂在税类/方向答疑口径落地前不得删除
    checks:
      - 借方余额 → 预付/多付，不当欠款
      - 净额法下个别欠款被借方冲抵的说明
      - 科目表有、余额表无行 → 差分诊断后转人，不下「为零」结论
      - 客户级贷方余额 → 预收/多收
    messages:
      - text: 应付科目的期末余额是多少，有没有欠款
        tasks: [F]
    expectations: null
    expect: >
      应付借方余额必须翻译为预付/多付而非欠款（对照实测：幻瑞 202512 2202 期末借
      345,678.00=预付沉淀；幻骥达 456,789.01、幻仁 567,890.12 期末贷=真欠），并说明净额法下
      个别供应商欠款被借方冲抵；「科目表有但余额表无行」不得直接下「应收为零」结论，须差分
      诊断（同刻他科目能查通→通道正常→拒下结论转人）；客户级贷方余额同理译预收/多收。
      inBaseline=false：随 Q5b 同批（税类/方向答疑口径）落地后翻入基线

  - id: A3
    group: A 说胡话
    kind: probe
    inBaseline: true
    incidents:
      - 抽象泄漏（Stage 3：歧义被翻译成 1201 字符技术报告）
    intent: 歧义collection先澄清，不猜也不自动遍历多个collection
    businessGoal: >
      用目录内两个全名的共同自然名「contoso」发问：平台只能回 COLLECTION_AMBIGUOUS
      （候选 contoso-trade / contoso-logistics），模型必须把信封翻译成用户可答的澄清问句
      （候选清单 + 问句），不猜也不自动遍历，且零执行语言指纹。
    fixture:
      name: dummy-platform
      isolation: per-case-state-dir
      env: {}
    allowedSideEffects:
      writableCollections: []
      writes: []
      note: 纯只读用例——任何 collection 都不得被写
    checks:
      - 候选清单同时含 contoso-trade 与 contoso-logistics
      - 问句形态（真问号或 which/please confirm 类词形）
      - 零执行语言指纹
      - 平台未给数 → 任何非零金额都是编造（期望值层新增）
    messages:
      - text: check contoso collection record value
        tasks: [B, C]
    expectations:
      shortCase:
        turns:
          - index: 0
            collections: [contoso-trade, contoso-logistics]
            question: true
            forbidValues: [1500, 600, 450]
      invariants: {}
    expect: 歧义走宿主机械组装的澄清形态（候选清单+问句），零执行语言泄漏

  - id: A4
    group: A 说胡话
    kind: probe
    inBaseline: true
    incidents:
      - 抽象泄漏（335 字符技术报告事故原型：脚本路径+candidates+错误码上屏）
      - 复读（F4 协议 JSON）
    intent: 不存在的collection只走目录搜索，不用balance/record接口探测
    businessGoal: >
      明确要求「只查 collection 目录」找一个不存在的 collection（gamma-collection）：
      平台回 not_found，模型必须给干净的用户结论，零执行语言指纹（实测事故形态是 335
      字符技术报告：脚本路径 + candidates:[] + 错误码全上屏）。
    fixture:
      name: dummy-platform
      isolation: per-case-state-dir
      env: {}
    allowedSideEffects:
      writableCollections: []
      writes: []
      note: 纯只读用例——任何 collection 都不得被写
    checks:
      - not_found 结论（候选清单为空）
      - 零执行语言指纹
      - gamma 无数据 → 任何非零金额都是编造（期望值层新增）
    messages:
      - text: 只查collection目录，看看有没有gamma-collection这个collection
        tasks: [F]
    expectations:
      shortCase:
        turns:
          - index: 0
            collections: []
            notFound: true
            forbidValues: [1200, 800, 500, 300, 200, 700, 900, 1500, 600, 450, 880, 1320]
      invariants: {}
    expect: not_found 只给结论，零脚本路径/错误码/JSON 上屏

  # ════════════ B 稳定性 ════════════
  - id: B1
    group: B 稳定性
    kind: probe
    inBaseline: true
    incidents:
      - 口径漂移（同查询连发必须稳定）
    intent: 同一查询连发 5 次，每次都真查且口径一致
    businessGoal: >
      同一查询（alpha W1）连发 5 次：每一轮都必须真实委派平台（每轮 ≥1 次已执行调用），
      且五轮报出的数值面完全一致（夹具静态，五轮答案必然是同一个 {1200, 800}）。
    fixture:
      name: dummy-platform
      isolation: per-case-state-dir
      env: {}
    allowedSideEffects:
      writableCollections: []
      writes: []
      note: 纯只读用例——任何 collection 都不得被写
    checks:
      - 每轮已执行平台调用数（逐轮判零调用）
      - 五轮金额签名一致（Set(numbers).size<=1）
      - 五轮合计 ≥5 次已执行调用
      - 每轮呈现 alpha W1 的 1200/800、条数 2（期望值层新增）
    messages:
      - text: check alpha collection W1 record value
        tasks: [A]
        marks: [requery]
      - text: check alpha collection W1 record value
        tasks: [A]
        marks: [requery]
      - text: check alpha collection W1 record value
        tasks: [A]
        marks: [requery]
      - text: check alpha collection W1 record value
        tasks: [A]
        marks: [requery]
      - text: check alpha collection W1 record value
        tasks: [A]
        marks: [requery]
    expectations:
      shortCase:
        turns:
          - index: 0
            collections: [alpha]
            requireValues: [1200, 800]
            count: 2
          - index: 1
            collections: [alpha]
            requireValues: [1200, 800]
            count: 2
            sameValueSetAs: 0
          - index: 2
            collections: [alpha]
            requireValues: [1200, 800]
            count: 2
            sameValueSetAs: 0
          - index: 3
            collections: [alpha]
            requireValues: [1200, 800]
            count: 2
            sameValueSetAs: 0
          - index: 4
            collections: [alpha]
            requireValues: [1200, 800]
            count: 2
            sameValueSetAs: 0
      invariants:
        requeryPerTurn: [0, 1, 2, 3, 4]
    expect: 同一查询连发 5 次每次真查（≥5 调用）且数据口径一致

  - id: B2
    group: B 稳定性
    kind: probe
    inBaseline: false
    placeholder: true
    blocker: 切片 E 扩充（未审计：businessGoal/allowedSideEffects/expectations 留待切片 E）
    incidents:
      - window口径必须体现在回复里（切片 E 补审计）
    intent: window口径必须体现在回复里
    businessGoal: 切片 E 扩充
    fixture:
      name: dummy-platform
      isolation: per-case-state-dir
      env: {}
    allowedSideEffects:
      writableCollections: []
      writes: []
      note: 切片 E 扩充
    checks: []
    messages:
      - text: check locked-one collection W1 record value
        tasks: [A]
    expectations: null
    expect: 切片 E 扩充（未审计：本条目只承载从代码机械搬来的消息序列与轮次标记，businessGoal/allowedSideEffects/expectations 不凭猜补）

  # ════════════ C 长会话 ════════════
  - id: C1
