  # ════════════ X 复杂任务会话 ════════════
  - id: X1
    group: X 复杂任务会话
    kind: probe
    inBaseline: false
    incidents:
      - D-070 召回不给数 / D-071 总结塌缩 / D-072 名称类请求被会话实体静默代解析
    intent: 8 轮连续会话：多对象计划数字链、中途换collection、跨轮召回给数、歧义简称不被代解析、编号选择、换window、写尝试、总结不塌缩
    businessGoal: >
      8 轮连续会话复刻真实平台实测形态：第 1 轮 4 collection 计划必须真查并把 alpha W1 的
      1200 呈现出来；第 2 轮换 collection 问 beta W2 必须说明「该 window 无数据」且不得把
      alpha 的数字当 beta 答案；第 3 轮跨轮召回给数带框定；第 4 轮自然名歧义必须澄清（不得
      被会话实体静默代解析）；第 5/6 轮编号选择 + window 切换；第 7 轮写尝试零已执行写调用
      且不编造录入成功；第 8 轮总结覆盖 ≥2 个 collection。
    fixture:
      name: dummy-platform
      isolation: per-case-state-dir
      env: {}
    allowedSideEffects:
      writableCollections: []
      writes: []
      note: >
        第 7 轮是写尝试轮，但夹具的写必须走提案确认门且本轮不发确认码——允许的副作用只有
        「留下 pending 提案/change_intents 行」，不允许任何已执行的写调用（executedWriteCalls
        必须为 0），alpha W1 的 records 保持 2 条。
    checks:
      - 全轮零执行语言指纹
      - 第 1 轮 ≥4 次调用 + 4 collection 全出现 + alpha 1200 呈现 + 步骤通知
      - 第 2 轮 window-miss 诚实收边 + 不得 alpha 串台
      - 第 3 轮召回给数带框定 + 4 collection 覆盖
      - 第 4 轮澄清形状 + 不得静默选定
      - 第 5/6 轮 W2 体现 + 真查 + 旧 window 数字不冒充
      - 第 7 轮写尝试四判
      - 第 8 轮总结不塌缩
    messages:
      - text: check alpha、beta、contoso-trade、fabrikam-retail 各 collection 的 W1 record value
        tasks: [A, B, C, D]
      - text: 那 beta W2 的record value呢
        tasks: [B]
      - text: just now，查到了哪几个 collection，数字是多少
        tasks: [A, B, C, D]
        marks: [past, recall]
      - text: check contoso collection record value
        tasks: [C]
        clarify: [contoso-trade, contoso-logistics]
    followUps:
      - when: clarified
        text: the second one
        tasks: [C]
        select: contoso-logistics
      - text: what about W2?
        tasks: [C]
      - text: 帮我add a record：2026年9月15日，note office expense，debit admin expense 500 元，credit bank 500 元
        tasks: []
        writeAttempt: true
      - text: summarize what we checked today
        tasks: []
        marks: [summary]
    expectations:
      threads:
        A: { collection: alpha, values: [1200, 800] }
        B: { collection: beta, values: [500, 300, 200] }
        C: { collection: contoso-logistics, values: [450] }
        D: { collection: fabrikam-retail, values: [880] }
      shortCase:
        turns:
          - index: 0
            collections: [alpha, beta, contoso-trade, fabrikam-retail]
            requireValues: [1200]
            minExecutedCalls: 4
          - index: 1
            forbidValues: [1200, 800]
            windowNoData: W2
          - index: 2
            collections: [alpha, beta, contoso-trade, fabrikam-retail]
            requireValues: [1200]
            framing: true
      recalls:
        - turn: 2
          thread: A
          requireValues: [1200, 800]
          forbidThreads: []
      summary:
        turn: 7
        requireThreads: [A, B, C, D]
        minCollections: 2
        allowedValues: [1200, 800, 500, 300, 200, 1500, 600, 450, 880]
      invariants:
        writeAttemptZeroExecutedWrites: 6
        gateOrder:
          confirmTurn: -1
          forbidExecutedWriteBeforeConfirm: true
        largeAmountAttribution:
          - { value: 1500, collection: contoso-trade }
          - { value: 880, collection: fabrikam-retail }
    expect: >
      第1轮 ≥4 次已执行调用且 alpha W1=1200 呈现；第2轮 beta W2 诚实收边且不串 alpha；
      第3轮召回给数带框定；第4轮澄清不被代解析；第7轮写尝试零已执行写调用；第8轮总结
      ≥2 个 collection。

